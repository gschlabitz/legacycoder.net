# Registry of pixel-art tilesheets under public/tiles. `npm run tile-css`
# reads this file, measures each PNG, and regenerates src/styles/tiles.css
# plus src/data/tilesheets.json. Sheets must be the *packed* variant
# (edge-to-edge tiles, no spacing) — the generator errors when the image
# dimensions are not an exact multiple of tileSize.
#
# All sheets so far: Kenney (kenney.nl), CC0.

- name: farm
  file: public/tiles/farm.png
  tileSize: 18
  author: Kenney
  source: https://kenney.nl/assets/pixel-platformer-farm-expansion
