# Generated by `npm run care-calendar` — the materialized care schedule
# rendered by the plants index. Derived deterministically from each plant
# page's `plant.care` frontmatter, so regenerating after adding a plant (or
# extending the span) leaves existing dates untouched. Every task counts from
# one shared day grid (odd intervals nudged ±1 onto it), so care events pile
# onto the same days instead of scattering. Liquid feeding waters
# too, so a fertilizing day omits that plant from watering. Values are plant
# slugs; the page localizes titles at render time.

